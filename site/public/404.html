<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Underwrite</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // SPA fallback for GitHub Pages: redirect to the app root.
      // Static single-page landing — any unknown path lands on the index.
      (function () {
        try {
          var search = window.location.search;
          var hash = window.location.hash;
          window.location.replace("./" + search + hash);
        } catch (e) {
          window.location.replace("./");
        }
      })();
    </script>
    <style>
      html, body { margin: 0; background: #0a0a0b; color: #f5f5f4; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .wrap { display: grid; place-items: center; height: 100dvh; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; margin: 0 auto 16px; animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
      small { color: #78716c; letter-spacing: 0.1em; text-transform: uppercase; font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <div class="dot"></div>
        <small>Loading Underwrite…</small>
      </div>
    </div>
  </body>
</html>
